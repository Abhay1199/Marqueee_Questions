<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Modal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
        }

        /* Open Modal Button */
        #open-btn {
            padding: 15px 35px;
            font-size: 20px;
            cursor: pointer;
        }

        /* Dark background */
        .modal {
            position: fixed;
            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-color: rgba(0, 0, 0, 0.5);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Modal Box */
        .modal-content {
            background-color: blue;

            width: 515px;
            min-height: 240px;

            border-radius: 15px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;
        }

        .modal-content h1 {
            margin: 0 0 5px 0;
            font-size: 40px;
        }

        .modal-content p {
            margin: 0 0 35px 0;
            font-size: 27px;
        }

        #close-btn {
            padding: 12px 28px;
            font-size: 20px;
            cursor: pointer;
        }

        /* Initially hidden */
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <!-- Open Button -->
    <button id="open-btn">Open Modal</button>


    <!-- Modal -->
    <div class="modal" id="modal">

        <div class="modal-content">

            <h1>Welcome!</h1>

            <p>This is a simple modal.</p>

            <button id="close-btn">Close</button>

        </div>

    </div>


    <script>

        let openBtn = document.getElementById("open-btn");
        let closeBtn = document.getElementById("close-btn");
        let modal = document.getElementById("modal");


        // Open modal
        openBtn.addEventListener("click", () => {

            modal.classList.remove("hidden");

        });


        // Close modal
        closeBtn.addEventListener("click", () => {

            modal.classList.add("hidden");

        });

    </script>

</body>
</html>
